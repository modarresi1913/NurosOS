[package]
name = "nuros-dev"
version = "0.1.0-alpha"
edition = "2021"
rust-version = "1.75"
authors = ["NurosOS Contributors"]
license = "Apache-2.0"
description = """
Developmental substrate for NurosOS — provides the runtime, interfaces,
environments, developmental mechanisms, observability, and reproducibility
infrastructure required to instantiate, develop, measure, fork, replay,
and compare artificial cognitive systems.
"""
homepage = "https://github.com/modarresi1913/NurosOS"
repository = "https://github.com/modarresi1913/NurosOS"
keywords = ["artificial-development", "cognitive-systems", "synthetic-minds", "developmental-trajectory"]
categories = ["science", "simulation"]

[lib]
name = "_dev"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"

[dev-dependencies]
proptest = "1.4"

[profile.release]
opt-level = 3
lto = "thin"
