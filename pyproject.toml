[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "nuros"
version = "0.3.0a0"
description = "NurosOS — experimental substrate for synthetic development (Python cognitive layer + Rust developmental substrate)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "NurosOS Contributors" }]
keywords = ["artificial-development", "cognitive-systems", "synthetic-minds", "developmental-trajectory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "maturin>=1.4,<2.0"]
plots = ["matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/modarresi1913/NurosOS"
Repository = "https://github.com/modarresi1913/NurosOS"

[tool.maturin]
manifest-path = "nuros-dev/Cargo.toml"
python-source = "."
module-name = "nuros._dev"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["nuros/tests"]
