[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "nuros-dev"
version = "0.1.0-alpha"
description = "Developmental substrate for NurosOS — artificial ontogenesis, mind diff, replay, reproducibility."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "NurosOS Contributors" }]
keywords = ["artificial-development", "cognitive-systems", "synthetic-minds"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "nuros._dev"
