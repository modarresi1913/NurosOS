[package]
name = "nuros-kernel"
version = "0.1.0-alpha"
edition = "2021"
rust-version = "1.75"
authors = ["NurosOS Contributors"]
license = "Apache-2.0"
description = """
Bio-inspired microkernel that schedules computational tasks based on
event-driven spiking dynamics, derived from the Drosophila connectome.
"""
homepage = "https://github.com/NurosOS/NurosOS"
repository = "https://github.com/NurosOS/NurosOS"
readme = "../README.md"
keywords = ["neuromorphic", "connectome", "spiking", "drosophila", "os"]
categories = ["os", "science", "simulation"]

[[bin]]
name = "nuros-kernel"
path = "src/main.rs"

[lib]
name = "nuros_kernel"
path = "src/lib.rs"

[dependencies]
# Lock-free data structures for zero-copy synaptic channels.
crossbeam-queue = "0.3"
crossbeam-utils = "0.8"

# Half-precision floats — used for synaptic weights (matches Loihi hardware).
half = { version = "2.4", features = ["num-traits"] }

# Logging (no_std-compatible).
log = { version = "0.4", features = ["release_max_level_info"] }
env_logger = "0.11"

# CLI argument parsing.
clap = { version = "4.5", features = ["derive"] }

# Connectome dataset loading (HDF5 / Numpy).
hdf5 = "0.8"
ndarray = "0.15"

# Serde for NIR (Neuromorphic Intermediate Representation) serialization.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Atomics & SIMD for vectorized membrane potential updates.
wide = "0.7"

# Error handling.
anyhow = "1.0"

[dev-dependencies]
proptest = "1.4"
criterion = "0.5"

[[bench]]
name = "spp_throughput"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"   # Mimics biological "hard stop" — no unwinding in the kernel.

[profile.bench]
inherits = "release"
debug = true
